# Faqat o'z VPS ingiz uchun (mcweb.uz da kerak emas — HTTPS va proksini platforma beradi).
# /etc/nginx/sites-available/tier.undeadmc.uz
#
# Yoqish:
#   sudo ln -s /etc/nginx/sites-available/tier.undeadmc.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (Let's Encrypt) — certbot shu faylga 443 blokini va 80 -> 443 yo'naltirishni o'zi qo'shadi:
#   sudo certbot --nginx -d tier.undeadmc.uz

server {
    listen 80;
    listen [::]:80;
    server_name tier.undeadmc.uz;

    # Statik fayllar Node'ga bormasdan to'g'ridan-to'g'ri diskdan beriladi.
    root /var/www/undeadmc-tiers/public;
    charset utf-8;
    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # CSS/JS: HTML ularga ?v=<hash> bilan murojaat qiladi, shuning uchun 1 yil keshlash xavfsiz.
    location ^~ /css/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location ^~ /js/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Logo, favicon, rasmlar: 30 kun.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Qolgan hammasi (sahifalar, /api, /admin) — Node.js (127.0.0.1:3000).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
